<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de Estadísticas — FIFA Partidos Haxball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch:        #0a0f0a;
    --pitch-deep:    #070a07;
    --card:         #131a10;
    --card-line:    #223018;
    --gold:         #c9a227;
    --gold-bright:  #f0d878;
    --gold-dim:     #7a651e;
    --cream:        #f3ecd9;
    --cream-dim:    #a5a08d;
    --bronze:       #b0703a;
    --silver:       #c7cdd6;
    --danger:       #d1483f;
    --live:         #57d68d;
    --discord:      #5865f2;
  }

  * { box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    zoom: 80%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,39,0.10), transparent),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 42px),
      var(--pitch);
    color: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 0 20px 60px;
  }

  .display { font-family: 'Bebas Neue', 'Inter', sans-serif; letter-spacing: 0.03em; }

  header {
    max-width: 1040px;
    margin: 0 auto;
    padding: 36px 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    position: relative;
    flex-wrap: wrap;
  }

  .crest {
    width: 54px;
    height: 54px;
    flex-shrink: 0;
    border-radius: 13px;
    object-fit: cover;
    box-shadow: 0 4px 14px -4px rgba(201,162,39,0.5);
  }

  .brand h1 { margin: 0; font-size: 32px; color: var(--gold-bright); text-shadow: 0 0 24px rgba(201,162,39,0.25); line-height: 1; }
  .brand .eyebrow {
    display: block; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 6px;
  }

  .discord-btn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px 9px 12px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--discord), #4752c4);
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 8px 20px -8px rgba(88,101,242,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .discord-btn:hover { transform: translateY(-50%) scale(1.04); box-shadow: 0 10px 24px -8px rgba(88,101,242,0.75); }
  .discord-btn svg { width: 19px; height: 19px; flex-shrink: 0; }

  @media (max-width: 720px) {
    .discord-btn { position: static; transform: none; margin-top: 12px; }
    .discord-btn:hover { transform: scale(1.04); }
  }

  hr.rule {
    max-width: 1040px; margin: 0 auto; border: none; height: 1px;
    background: linear-gradient(90deg, transparent, var(--card-line) 20%, var(--card-line) 80%, transparent);
  }

  .live-bar {
    max-width: 1040px;
    margin: 18px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--cream-dim);
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 0 rgba(87,214,141,0.6);
    animation: pulse 2s infinite;
  }
  .live-dot.off { background: var(--cream-dim); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(87,214,141,0.5); }
    70% { box-shadow: 0 0 0 7px rgba(87,214,141,0); }
    100% { box-shadow: 0 0 0 0 rgba(87,214,141,0); }
  }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

  .lider-wrap { max-width: 1040px; margin: 30px auto 0; }
  .lider-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cream-dim); margin: 0 0 14px 4px; }

  .lider-card {
    position: relative;
    border-radius: 18px;
    padding: 2px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold) 40%, var(--gold-dim) 70%, var(--gold) 100%);
    box-shadow: 0 20px 50px -20px rgba(201,162,39,0.35);
    cursor: pointer;
  }
  .lider-card-inner {
    border-radius: 16px;
    background: radial-gradient(ellipse 500px 260px at 15% 0%, rgba(240,216,120,0.12), transparent 60%), var(--card);
    padding: 28px 32px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 26px;
  }
  .lider-nivel {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 88px; height: 88px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.08), transparent 60%), var(--pitch-deep);
    border: 2px solid var(--gold); flex-shrink: 0;
  }
  .lider-nivel .n { font-family:'Bebas Neue'; font-size: 32px; color: var(--gold-bright); line-height: 1; }
  .lider-nivel .lbl { font-size: 9px; letter-spacing: 0.14em; color: var(--cream-dim); text-transform: uppercase; margin-top: 2px; }

  .lider-info .rango-line { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .lider-info h2 { margin: 0 0 12px; font-size: 30px; font-family: 'Bebas Neue'; color: var(--cream); letter-spacing: 0.02em; }
  .lider-stats { display: flex; gap: 24px; }
  .lider-stats .stat .v { font-family: 'Bebas Neue'; font-size: 22px; color: var(--gold-bright); line-height: 1; }
  .lider-stats .stat .k { font-size: 10px; color: var(--cream-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
  .lider-puntaje { text-align: right; padding-left: 20px; border-left: 1px solid var(--card-line); }
  .lider-puntaje .v { font-family: 'Bebas Neue'; font-size: 38px; color: var(--gold-bright); line-height: 1; }
  .lider-puntaje .k { font-size: 10px; color: var(--cream-dim); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 4px; }

  .panel { max-width: 1040px; margin: 34px auto 0; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .panel-head h3 { margin: 0; font-family: 'Bebas Neue'; font-size: 21px; letter-spacing: 0.04em; color: var(--cream); }
  .panel-head h3 span { color: var(--gold); }
  .panel-head .sub { font-size: 11.5px; color: var(--cream-dim); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  input, select {
    background: var(--card); border: 1px solid var(--card-line); color: var(--cream);
    padding: 9px 13px; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif;
  }
  input::placeholder { color: var(--cream-dim); }
  input:focus, select:focus { outline: 2px solid var(--gold-dim); outline-offset: 1px; }
  select { cursor: pointer; }

  .matches-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .match-card {
    flex: 0 0 auto; min-width: 190px; background: var(--card);
    border: 1px solid var(--card-line); border-radius: 12px; padding: 14px 16px;
  }
  .match-card .marcador { font-family: 'Bebas Neue'; font-size: 22px; text-align: center; letter-spacing: 0.03em; }
  .match-card .marcador .rojo { color: #e6656b; }
  .match-card .marcador .azul { color: #6fa8ff; }
  .match-card .meta { font-size: 10.5px; color: var(--cream-dim); text-align: center; margin-top: 4px; }
  .match-card .mvp { margin-top: 10px; font-size: 11px; text-align: center; color: var(--gold-bright); border-top: 1px solid var(--card-line); padding-top: 8px; }
  .match-card .mvp b { color: var(--cream); }

  .tabla-wrap { border-radius: 14px; border: 1px solid var(--card-line); background: var(--card); overflow: hidden; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 16px; text-align: left; font-size: 13.5px; border-bottom: 1px solid var(--card-line); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th { background: var(--pitch-deep); color: var(--cream-dim); font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.1em; }
  tbody tr { transition: background 0.12s ease; cursor: pointer; }
  tbody tr:hover td { background: rgba(201,162,39,0.06); }
  tbody tr:last-child td { border-bottom: none; }
  .pos { width: 34px; font-family: 'Bebas Neue'; font-size: 16px; color: var(--cream-dim); }
  tr.top1 .pos { color: var(--gold-bright); }
  tr.top2 .pos { color: var(--silver); }
  tr.top3 .pos { color: var(--bronze); }
  .nombre-cell { display: flex; align-items: center; gap: 8px; }
  .medalla { font-size: 13px; }
  .rango-tag { padding: 3px 9px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; display: inline-block; border: 1px solid transparent; }

  .estado, .error { text-align: center; color: var(--cream-dim); padding: 44px 20px; font-size: 14px; }
  .error { color: var(--danger); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(4,6,3,0.72);
    backdrop-filter: blur(2px); z-index: 50; align-items: flex-start; justify-content: center;
    padding: 60px 16px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }

  .modal-card { width: 100%; max-width: 560px; border-radius: 18px; padding: 2px; background: linear-gradient(135deg, var(--gold-bright), var(--gold) 45%, var(--gold-dim) 100%); }
  .modal-inner { background: var(--card); border-radius: 16px; padding: 28px; position: relative; }
  .modal-close {
    position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--pitch-deep); border: 1px solid var(--card-line); color: var(--cream-dim);
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { color: var(--cream); }

  .modal-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .modal-head .nivel-circulo {
    width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; background: var(--pitch-deep);
    border: 2px solid var(--gold); font-family: 'Bebas Neue'; font-size: 24px; color: var(--gold-bright);
  }
  .modal-head h2 { margin: 0; font-family: 'Bebas Neue'; font-size: 26px; color: var(--cream); }
  .modal-head .rango-line { font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }

  .progreso-wrap { margin-bottom: 22px; }
  .progreso-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--cream-dim); margin-bottom: 6px; }
  .progreso-barra { height: 8px; border-radius: 999px; background: var(--pitch-deep); overflow: hidden; border: 1px solid var(--card-line); }
  .progreso-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); border-radius: 999px; transition: width 0.4s ease; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stats-grid .box { background: var(--pitch-deep); border: 1px solid var(--card-line); border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stats-grid .box .v { font-family: 'Bebas Neue'; font-size: 20px; color: var(--gold-bright); }
  .stats-grid .box .k { font-size: 9.5px; color: var(--cream-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

  .grafico-wrap h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--cream-dim); margin: 0 0 10px; }
  #graficoPuntos { width: 100%; height: 120px; display: block; }
  .grafico-vacio { font-size: 12px; color: var(--cream-dim); text-align: center; padding: 30px 0; }

  footer {
    max-width: 1040px; margin: 40px auto 0; display: flex; justify-content: space-between; align-items: center;
    padding-top: 18px; border-top: 1px solid var(--card-line); flex-wrap: wrap; gap: 8px;
  }
  footer .actualizado { font-size: 11px; color: var(--cream-dim); }
  .marca-agua { font-size: 11px; color: var(--gold-dim); letter-spacing: 0.05em; }

  @media (max-width: 640px) {
    .lider-card-inner { grid-template-columns: 1fr; text-align: center; gap: 16px; }
    .lider-stats { justify-content: center; }
    .lider-puntaje { border-left: none; border-top: 1px solid var(--card-line); padding-left: 0; padding-top: 14px; text-align: center; }
    .panel-head { flex-direction: column; align-items: flex-start; }
    th, td { padding: 10px 10px; font-size: 12.5px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    tbody tr, .discord-btn { transition: none; }
  }
</style>
</head>
<body>

  <header>
    <img class="crest" src="fifo.png" alt="Logo de la comunidad" />
    <div class="brand">
      <span class="eyebrow">Comunidad Haxball</span>
      <h1 class="display">FIFA PARTIDOS HAXBALL</h1>
    </div>
    <a class="discord-btn" href="https://discord.gg/Xsxrn7xXD" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.3 5.3A18.5 18.5 0 0 0 15.7 4c-.2.4-.5.9-.6 1.3a17 17 0 0 0-6.2 0A9 9 0 0 0 8.3 4a18.4 18.4 0 0 0-4.6 1.4C1.3 9.6.6 13.7 1 17.8a18.6 18.6 0 0 0 5.7 2.9c.4-.6.8-1.3 1.1-2a12 12 0 0 1-1.8-.9l.4-.3a13.2 13.2 0 0 0 11.2 0l.4.3c-.6.3-1.2.6-1.8.9.3.7.7 1.4 1.1 2a18.5 18.5 0 0 0 5.7-2.9c.5-4.8-.7-8.9-2.7-12.5ZM8.7 15.4c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2Zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2Z"/>
      </svg>
      Unite al Discord
    </a>
  </header>

  <hr class="rule" />

  <div class="live-bar">
    <span class="live-dot off" id="liveDot"></span>
    <span id="liveTexto">Consultando estado del host…</span>
  </div>

  <div class="lider-wrap">
    <p class="lider-eyebrow">Puntero de la tabla</p>
    <div id="liderCard"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>Últimos <span>partidos</span></h3>
      <span class="sub" id="matchesSub"></span>
    </div>
    <div class="matches-row" id="matchesRow">
      <p class="estado">Cargando partidos…</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>Tabla de <span>posiciones</span></h3>
      <div class="controls">
        <input type="text" id="buscador" placeholder="Buscar jugador…" />
        <select id="orden">
          <option value="puntaje">Puntaje</option>
          <option value="goles">Goles</option>
          <option value="asistencias">Asistencias</option>
          <option value="atajadas">Tapadas</option>
          <option value="nivel">Nivel</option>
          <option value="ganados">Partidos ganados</option>
        </select>
      </div>
    </div>
    <div class="tabla-wrap">
      <div id="contenido"><p class="estado">Cargando estadísticas…</p></div>
    </div>
  </div>

  <footer>
    <span class="actualizado" id="actualizado"></span>
    <span class="marca-agua">Creado por PastaBase</span>
  </footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-inner" id="modalInner">
        <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
        <div id="modalContenido"><p class="estado">Cargando…</p></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://haxball-stats-api-ft5y.onrender.com";
    let jugadores = [];

    async function cargarDatos(orden = "puntaje") {
      const contenido = document.getElementById("contenido");
      contenido.innerHTML = '<p class="estado">Cargando estadísticas…</p>';
      try {
        const res = await fetch(`${API_URL}/api/players?sort=${orden}&limit=100`);
        if (!res.ok) throw new Error("Respuesta no OK");
        jugadores = await res.json();
        renderizarLider(jugadores[0]);
        renderizarTabla(jugadores);
        document.getElementById("actualizado").textContent =
          "Actualizado " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
      } catch (err) {
        contenido.innerHTML = '<p class="error">No se pudo cargar la información. El servidor puede estar "despertando" — probá de nuevo en unos segundos.</p>';
        console.error(err);
      }
    }

    async function cargarPartidos() {
      const fila = document.getElementById("matchesRow");
      try {
        const res = await fetch(`${API_URL}/api/matches?limit=8`);
        if (!res.ok) throw new Error("no ok");
        const partidos = await res.json();
        if (!partidos.length) {
          fila.innerHTML = '<p class="estado">Todavía no se jugó ningún partido registrado.</p>';
          return;
        }
        fila.innerHTML = partidos.map(p => `
          <div class="match-card">
            <div class="marcador"><span class="rojo">${p.scoreRed}</span> — <span class="azul">${p.scoreBlue}</span></div>
            <div class="meta">${p.duracion || ""} · ${formatearFecha(p.fecha)}</div>
            ${p.mvp ? `<div class="mvp">⭐ MVP <b>${escapeHtml(p.mvp)}</b></div>` : ""}
          </div>
        `).join("");
      } catch (err) {
        fila.innerHTML = '<p class="estado">No se pudo cargar el historial de partidos.</p>';
      }
    }

    async function cargarEstadoVivo() {
      const dot = document.getElementById("liveDot");
      const texto = document.getElementById("liveTexto");
      try {
        const res = await fetch(`${API_URL}/api/status`);
        const estado = await res.json();
        if (estado.cantidad > 0) {
          dot.classList.remove("off");
          texto.textContent = `${estado.cantidad} jugador${estado.cantidad === 1 ? "" : "es"} en el host ahora` + (estado.enPartido ? " · partido en curso" : "");
        } else {
          dot.classList.add("off");
          texto.textContent = "El host está vacío en este momento";
        }
      } catch (err) {
        dot.classList.add("off");
        texto.textContent = "No se pudo consultar el estado del host";
      }
    }

    function formatearFecha(fechaISO) {
      if (!fechaISO) return "";
      const d = new Date(fechaISO);
      return d.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" }) + " " +
             d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    }

    function renderizarLider(j) {
      const card = document.getElementById("liderCard");
      if (!j) { card.innerHTML = ""; return; }
      card.innerHTML = `
        <div class="lider-card" onclick="abrirFicha('${encodeURIComponent(j.name)}')">
          <div class="lider-card-inner">
            <div class="lider-nivel"><span class="n">${j.nivel}</span><span class="lbl">Nivel</span></div>
            <div class="lider-info">
              <p class="rango-line">${escapeHtml(j.rango)}</p>
              <h2>${escapeHtml(j.name)}</h2>
              <div class="lider-stats">
                <div class="stat"><div class="v">${j.goles}</div><div class="k">Goles</div></div>
                <div class="stat"><div class="v">${j.asistencias}</div><div class="k">Asist.</div></div>
                <div class="stat"><div class="v">${j.atajadas}</div><div class="k">Tapadas</div></div>
                <div class="stat"><div class="v">${j.ganados}/${j.partidos}</div><div class="k">PG / PJ</div></div>
              </div>
            </div>
            <div class="lider-puntaje"><div class="v">${j.puntaje}</div><div class="k">Puntos</div></div>
          </div>
        </div>
      `;
    }

    function renderizarTabla(lista) {
      const contenido = document.getElementById("contenido");
      if (!lista.length) {
        contenido.innerHTML = '<p class="estado">Todavía no hay jugadores registrados.</p>';
        return;
      }
      const medallas = ["🥇", "🥈", "🥉"];
      let filas = lista.map((j, i) => {
        const claseFila = i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : "";
        const medalla = i < 3 ? `<span class="medalla">${medallas[i]}</span>` : "";
        const colorRango = j.rangoColor || "#232d1c";
        const colorTexto = j.rangoColor ? "#0a0f0a" : "#c9cabb";
        return `
          <tr class="${claseFila}" onclick="abrirFicha('${encodeURIComponent(j.name)}')">
            <td class="pos">${i + 1}</td>
            <td><div class="nombre-cell">${medalla}<strong>${escapeHtml(j.name)}</strong></div></td>
            <td><span class="rango-tag" style="background:${colorRango}; color:${colorTexto}">${escapeHtml(j.rango)}</span></td>
            <td>${j.nivel}</td>
            <td>${j.puntaje}</td>
            <td>${j.goles}</td>
            <td>${j.asistencias}</td>
            <td>${j.atajadas}</td>
            <td>${j.ganados}/${j.partidos}</td>
          </tr>
        `;
      }).join("");

      contenido.innerHTML = `
        <table>
          <thead><tr>
            <th>#</th><th>Jugador</th><th>Rango</th><th>Nivel</th><th>Puntos</th>
            <th>Goles</th><th>Asist.</th><th>Tapadas</th><th>PG/PJ</th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>
      `;
    }

    async function abrirFicha(nombreCodificado) {
      const overlay = document.getElementById("modalOverlay");
      const contenido = document.getElementById("modalContenido");
      overlay.classList.add("open");
      contenido.innerHTML = '<p class="estado">Cargando…</p>';

      const nombre = decodeURIComponent(nombreCodificado);
      try {
        const [resJugador, resHistorial] = await Promise.all([
          fetch(`${API_URL}/api/players/${encodeURIComponent(nombre)}`),
          fetch(`${API_URL}/api/history/${encodeURIComponent(nombre)}`),
        ]);
        const j = await resJugador.json();
        const historial = resHistorial.ok ? await resHistorial.json() : [];

        const faltan = j.puntosFaltantes ?? 0;
        const porcentaje = j.progresoPorcentaje ?? 0;

        contenido.innerHTML = `
          <div class="modal-head">
            <div class="nivel-circulo">${j.nivel}</div>
            <div>
              <p class="rango-line">${escapeHtml(j.rango)}</p>
              <h2>${escapeHtml(j.name)}</h2>
            </div>
          </div>

          <div class="progreso-wrap">
            <div class="progreso-labels">
              <span>Progreso al próximo nivel</span>
              <span>${j.nivel >= 100 ? "Nivel máximo" : `Faltan ${faltan} pts`}</span>
            </div>
            <div class="progreso-barra"><div class="progreso-fill" style="width:${porcentaje}%"></div></div>
          </div>

          <div class="stats-grid">
            <div class="box"><div class="v">${j.puntaje}</div><div class="k">Puntos</div></div>
            <div class="box"><div class="v">${j.goles}</div><div class="k">Goles</div></div>
            <div class="box"><div class="v">${j.asistencias}</div><div class="k">Asistencias</div></div>
            <div class="box"><div class="v">${j.atajadas}</div><div class="k">Tapadas</div></div>
            <div class="box"><div class="v">${j.ganados}/${j.partidos}</div><div class="k">PG / PJ</div></div>
            <div class="box"><div class="v">${j.vallasinvictas}</div><div class="k">Vallas invictas</div></div>
          </div>

          <div class="grafico-wrap">
            <h4>Evolución de puntaje</h4>
            <div id="graficoContenedor"></div>
          </div>
        `;

        dibujarGrafico(historial);
      } catch (err) {
        contenido.innerHTML = '<p class="error">No se pudo cargar la ficha de este jugador.</p>';
        console.error(err);
      }
    }

    function dibujarGrafico(historial) {
      const contenedor = document.getElementById("graficoContenedor");
      if (!historial || historial.length < 2) {
        contenedor.innerHTML = '<p class="grafico-vacio">Todavía no hay suficiente historial para graficar.</p>';
        return;
      }
      contenedor.innerHTML = '<canvas id="graficoPuntos"></canvas>';
      const canvas = document.getElementById("graficoPuntos");
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth || 500;
      const h = 120;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const valores = historial.map(p => p.puntaje);
      const min = Math.min(...valores);
      const max = Math.max(...valores);
      const rango = max - min || 1;
      const pad = 10;

      const puntos = valores.map((v, i) => {
        const x = pad + (i / (valores.length - 1)) * (w - pad * 2);
        const y = h - pad - ((v - min) / rango) * (h - pad * 2);
        return [x, y];
      });

      ctx.beginPath();
      ctx.moveTo(puntos[0][0], h - pad);
      puntos.forEach(([x, y]) => ctx.lineTo(x, y));
      ctx.lineTo(puntos[puntos.length - 1][0], h - pad);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "rgba(240,216,120,0.28)");
      grad.addColorStop(1, "rgba(240,216,120,0)");
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      puntos.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
      ctx.strokeStyle = "#f0d878";
      ctx.lineWidth = 2;
      ctx.lineJoin = "round";
      ctx.stroke();

      const [lx, ly] = puntos[puntos.length - 1];
      ctx.beginPath();
      ctx.arc(lx, ly, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "#f0d878";
      ctx.fill();
    }

    function cerrarFicha() {
      document.getElementById("modalOverlay").classList.remove("open");
    }
    document.getElementById("modalClose").addEventListener("click", cerrarFicha);
    document.getElementById("modalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "modalOverlay") cerrarFicha();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarFicha(); });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    document.getElementById("orden").addEventListener("change", (e) => cargarDatos(e.target.value));
    document.getElementById("buscador").addEventListener("input", (e) => {
      const texto = e.target.value.toLowerCase();
      const filtrados = jugadores.filter(j => j.name.toLowerCase().includes(texto));
      renderizarTabla(filtrados);
    });

    cargarDatos();
    cargarPartidos();
    cargarEstadoVivo();
    setInterval(() => cargarDatos(document.getElementById("orden").value), 30000);
    setInterval(cargarEstadoVivo, 15000);
    setInterval(cargarPartidos, 60000);
  </script>

</body>
