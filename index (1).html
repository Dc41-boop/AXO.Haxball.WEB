<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stats del Host</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-card: #171a24;
    --border: #262a38;
    --text: #e8e9ee;
    --text-dim: #8a8fa3;
    --accent: #4dd2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    text-align: center;
    margin-bottom: 4px;
    font-size: 28px;
  }
  .subtitle {
    text-align: center;
    color: var(--text-dim);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  input, select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  table {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    border-collapse: collapse;
    background: var(--bg-card);
    border-radius: 12px;
    overflow: hidden;
  }
  th, td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  th {
    background: #1d2130;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  tr:hover td { background: #1c2030; }
  .pos { color: var(--text-dim); width: 30px; }
  .rango-tag {
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    display: inline-block;
  }
  .loading, .error {
    text-align: center;
    color: var(--text-dim);
    padding: 40px;
  }
  .error { color: #ff6b6b; }
</style>
</head>
<body>

  <h1>📊 Stats del Host</h1>
  <p class="subtitle">Estadísticas en vivo, actualizadas automáticamente</p>

  <div class="controls">
    <input type="text" id="buscador" placeholder="Buscar jugador..." />
    <select id="orden">
      <option value="puntaje">Ordenar por Puntaje</option>
      <option value="goles">Ordenar por Goles</option>
      <option value="asistencias">Ordenar por Asistencias</option>
      <option value="atajadas">Ordenar por Tapadas</option>
      <option value="nivel">Ordenar por Nivel</option>
      <option value="ganados">Ordenar por Partidos Ganados</option>
    </select>
  </div>

  <div id="contenido">
    <p class="loading">Cargando estadísticas...</p>
  </div>

  <script>
    // 👇 Cambiá esto por la URL real de tu API una vez desplegada en Render
    const API_URL = "https://haxball-stats-api-ft5y.onrender.com";

    let jugadores = [];

    async function cargarDatos(orden = "puntaje") {
      const contenido = document.getElementById("contenido");
      contenido.innerHTML = '<p class="loading">Cargando estadísticas...</p>';
      try {
        const res = await fetch(`${API_URL}/api/players?sort=${orden}&limit=100`);
        if (!res.ok) throw new Error("Respuesta no OK");
        jugadores = await res.json();
        renderizarTabla(jugadores);
      } catch (err) {
        contenido.innerHTML = `<p class="error">No se pudo cargar la información. Puede que el servidor esté "despertando" (tarda ~30s la primera vez) — probá de nuevo en un momento.</p>`;
        console.error(err);
      }
    }

    function renderizarTabla(lista) {
      const contenido = document.getElementById("contenido");
      if (!lista.length) {
        contenido.innerHTML = '<p class="loading">No hay jugadores registrados todavía.</p>';
        return;
      }

      let filas = lista.map((j, i) => `
        <tr>
          <td class="pos">${i + 1}</td>
          <td><strong>${escapeHtml(j.name)}</strong></td>
          <td><span class="rango-tag" style="background:${j.rangoColor || '#2a2e3d'}; color:${j.rangoColor ? '#111' : '#cfd2dd'}">${escapeHtml(j.rango)} (${j.nivel})</span></td>
          <td>${j.puntaje}</td>
          <td>${j.goles}</td>
          <td>${j.asistencias}</td>
          <td>${j.atajadas}</td>
          <td>${j.ganados}/${j.partidos}</td>
        </tr>
      `).join("");

      contenido.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Jugador</th>
              <th>Rango</th>
              <th>Puntos</th>
              <th>Goles</th>
              <th>Asist.</th>
              <th>Tapadas</th>
              <th>PG/PJ</th>
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById("orden").addEventListener("change", (e) => {
      cargarDatos(e.target.value);
    });

    document.getElementById("buscador").addEventListener("input", (e) => {
      const texto = e.target.value.toLowerCase();
      const filtrados = jugadores.filter(j => j.name.toLowerCase().includes(texto));
      renderizarTabla(filtrados);
    });

    cargarDatos();
    // Refresca automáticamente cada 30 segundos
    setInterval(() => cargarDatos(document.getElementById("orden").value), 30000);
  </script>

</body>
</html>
